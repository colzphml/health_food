<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Рационы питания — Сергей & Эльвира</title>
<!-- PWA -->
<link rel="manifest" href="/health_food/manifest.json">
<meta name="theme-color" content="#0f1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рацион">
<link rel="apple-touch-icon" href="/health_food/icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1210;
    --surface: #181e19;
    --card: #1e2720;
    --border: #2e3d2e;
    --accent: #7fb069;
    --accent2: #d4956a;
    --text: #e8ede6;
    --text-muted: #7a9175;
    --text-dim: #4a5e48;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }
  header {
    padding: 40px 24px 0;
    text-align: center;
  }
  header::after {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: var(--accent);
    margin: 14px auto 0;
    border-radius: 2px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 36px);
    color: var(--text);
  }
  header p {
    margin-top: 6px;
    color: var(--text-muted);
    font-size: 13px;
  }
  main {
    max-width: 700px;
    margin: 40px auto 0;
    padding: 0 20px;
  }
  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .menu-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .menu-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent)22;
  }
  .menu-card-left .week { font-size: 14px; font-weight: 500; }
  .menu-card-left .days { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .menu-card-right {
    font-size: 12px;
    color: var(--accent2);
    font-weight: 500;
    white-space: nowrap;
  }
  .empty {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 40px 0;
  }

  /* safe area для iOS (чёлка / Home indicator) */
  body { padding-bottom: env(safe-area-inset-bottom, 16px); }
  header { padding-top: max(40px, calc(env(safe-area-inset-top) + 16px)); }

  /* Pull-to-refresh индикатор */
  #ptr {
    position: fixed;
    top: -56px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px; height: 44px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #0f1210;
    z-index: 999;
    transition: top 0.18s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #ptr.show { top: calc(env(safe-area-inset-top, 0px) + 14px); }
  #ptr svg { width: 22px; height: 22px; transition: transform 0.18s; }
  #ptr.ready svg { transform: rotate(180deg); }
  #ptr.spin svg { animation: ptr-spin 0.5s linear infinite; }
  @keyframes ptr-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Рационы питания</h1>
  <p>Сергей &amp; Эльвира · персональные меню по неделям</p>
</header>
<main>
  <h2>Готовые меню</h2>
  <div class="menu-list">

    <a class="menu-card" href="menus/2026/week_2026-04-22_vt-ch.html">
      <div class="menu-card-left">
        <div class="week">Неделя 22 апреля 2026</div>
        <div class="days">Вторник – Четверг · ~2070 ккал/день</div>
      </div>
      <div class="menu-card-right">→</div>
    </a>

  </div>
</main>

<!-- Pull-to-refresh -->
<div id="ptr">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    <polyline points="21 3 21 9 15 9"/>
  </svg>
</div>

<script>
  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/health_food/sw.js', { scope: '/health_food/' });
  }

  // Pull-to-refresh
  (function () {
    const ptr = document.getElementById('ptr');
    const THRESHOLD = 72;
    let startY = 0, delta = 0, active = false;

    document.addEventListener('touchstart', e => {
      if (window.scrollY === 0) { startY = e.touches[0].clientY; active = true; }
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (!active) return;
      delta = Math.max(0, e.touches[0].clientY - startY);
      if (delta > 10) {
        ptr.classList.add('show');
        if (delta > THRESHOLD) ptr.classList.add('ready');
        else ptr.classList.remove('ready');
      }
    }, { passive: true });

    document.addEventListener('touchend', () => {
      if (!active) return;
      active = false;
      if (delta > THRESHOLD) {
        ptr.classList.remove('ready');
        ptr.classList.add('spin');
        setTimeout(() => location.reload(), 450);
      } else {
        ptr.classList.remove('show', 'ready');
      }
      delta = 0;
    });
  })();
</script>
</body>
</html>
